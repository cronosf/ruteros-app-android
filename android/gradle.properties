org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Jetifier reescribe librerias viejas del legacy android.support.* a AndroidX;
# todo lo que usamos ya es AndroidX nativo, y con Firebase sumado el heap se
# quedaba sin memoria transformando jars que ni lo necesitaban.
android.enableJetifier=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# El proyecto (D:) y la cache de Gradle/pub (C:) estan en discos distintos: el
# compilador incremental de Kotlin (Build Tools API) intenta calcular una ruta
# relativa entre archivos con distinta raiz de disco y tira IllegalArgumentException.
# Se desactiva el incremental para evitar ese bug (build un poco mas lento, sin otro efecto).
kotlin.incremental=false
